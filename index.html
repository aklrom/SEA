<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUIZ</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
        <header>
            <h1>Le Grand QuiZ</h1>
        </header>
        <main>
            <div id="registration">
                <form id="formulaire">
                    <div id="inputsection">
                        <label for="name">Nom:</label>
                        <input type="text" name="name" id="name">
                    </div>
                    <button type="submit">Valider</button>
                </form>
            </div>
            <div id="gamesection" class="hidden">
                <div id="ranksection">
                <table>
                    <thead>
                        <tr>
                            <th>Rang</th>
                            <th>Joueur</th>
                            <th>Score</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr id="top1">
                            <td>1</td>
                            <td>top1</td>
                            <td>???</td>
                        </tr>
                        <tr id="top2">
                            <td>2</td>
                            <td>top2</td>
                            <td>???</td>
                        </tr>
                        <tr id="top3">
                            <td>3</td>
                            <td>top3</td>
                            <td>???</td>
                        </tr>
                        <tr id="top4">
                            <td>4</td>
                            <td>top4</td>
                            <td>???</td>
                        </tr>
                        <tr id="top5">
                            <td>5</td>
                            <td>top5</td>
                            <td>???</td>
                        </tr>
                        <tr id="top6">
                            <td>6</td>
                            <td>top6</td>
                            <td>???</td>
                        </tr>
                        <tr id="top7">
                            <td>7</td>
                            <td>top7</td>
                            <td>???</td>
                        </tr>
                        <tr id="top8">
                            <td>8</td>
                            <td>top8</td>
                            <td>???</td>
                        </tr>
                        <tr id="top9">
                            <td>9</td>
                            <td>top9</td>
                            <td>???</td>
                        </tr>
                        <tr id="top10">
                            <td>10</td>
                            <td>top10</td>
                            <td>???</td>
                        </tr>
                    </tbody>
                </table>

            </div>

            <div id="questionsection">
                <div id="questionscreen">
                </div>
                <div id="answers">
                    <div id="answer1" class="answer"></div>
                    <div id="answer2" class="answer"></div>
                    <div id="answer3" class="answer"></div>
                    <div id="answer4" class="answer"></div>
                </div>
            </div>

            <div id="statsection">
                <button id="joker">Joker</button>
                <div id="point">
                    <p id="playernamesection"></p>
                    <p id="points">0</p>
                </div>
                <button id="reset">Rejouer</button>
            </div>
            </div>
        </main>

    <script src="index.js"></script>    
</body>
</html>
